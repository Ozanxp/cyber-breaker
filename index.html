<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swipe Brick Breaker: Cyber Edition</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100vh;
            background-color: #0d0f18;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            position: fixed;
        }
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121526;
            display: flex;
            flex-direction: column;
        }
        #hud {
            width: 100%;
            height: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            background: #161a2e;
            border-bottom: 1px solid #222b45;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }
        canvas {
            display: block;
            background: #090b10;
            width: 100%;
            flex-grow: 1;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 24, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        p {
            font-size: 13px;
            margin-bottom: 20px;
            color: #a0aabf;
        }
        .btn {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #0d0f18;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            margin: 10px;
        }
        .btn-ad {
            background: linear-gradient(135deg, #ff00ff, #8800ff);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Üst Bilgi Paneli -->
        <div id="hud">
            <div>TUR: <span id="round-text">1</span></div>
            <div>TOP: <span id="balls-text">1</span></div>
            <div>SKOR: <span id="score-text">0</span></div>
        </div>

        <!-- Oyun Alanı -->
        <canvas id="gameCanvas"></canvas>

        <!-- Başlangıç Ekranı -->
        <div id="start-screen" class="ui-overlay">
            <h1>CYBER BREAKER</h1>
            <p>Topları fırlat, tuğlaları kır, tur geç!</p>
            <button class="btn" onclick="startGame()">OYUNA BAŞLA</button>
        </div>

        <!-- Oyun Bitti Ekranı -->
        <div id="game-over-screen" class="ui-overlay" style="display: none;">
            <h1>OYUN BİTTİ</h1>
            <p>Skorun: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">TEKRAR DENE</button>
            <button class="btn btn-ad" onclick="watchAdForExtraBalls()">🎬 REKLAM İZLE (+5 TOP)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const ADSGRAM_BLOCK_ID = "46174"; // Adsgram Onaylı Blok ID
        let adController = null;

        if (window.Adsgram) {
            adController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        }

        function watchAdForExtraBalls() {
            if (!adController) {
                grantExtraBallsReward();
                return;
            }
            adController.show()
                .then(() => { grantExtraBallsReward(); })
                .catch((err) => { console.warn("Reklam kapatıldı:", err); });
        }

        function grantExtraBallsReward() {
            ballCount += 5;
            document.getElementById('balls-text').innerText = ballCount;
            document.getElementById('game-over-screen').style.display = 'none';
            gameState = 'AIMING';
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 45;
            groundY = canvas.height - 30;
            returnX = canvas.width / 2;
        }
        window.addEventListener('resize', resizeCanvas);

        let gameState = 'START';
        let score = 0;
        let round = 1;
        let ballCount = 1;
        let balls = [];
        let bricks = [];
        let aimStart = { x: 0, y: 0 };
        let aimEnd = { x: 0, y: 0 };
        let isAiming = false;
        let returnX = 0;
        let groundY = 0;
        const COLS = 7;

        class Ball {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.radius = 6; this.active = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
                if (this.y > groundY) {
                    this.active = false;
                    this.vx = 0; this.vy = 0;
                    this.x = returnX; this.y = groundY;
                }
            }
            draw() {
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Brick {
            constructor(r, c, hp) {
                this.r = r; this.c = c; this.hp = hp;
                this.w = (canvas.width / COLS) - 4;
                this.h = 40;
                this.x = c * (canvas.width / COLS) + 2;
                this.y = r * 45 + 10;
            }
            draw() {
                if (this.hp <= 0) return;
                ctx.fillStyle = this.hp > 10 ? '#ff0055' : '#0088ff';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.hp, this.x + this.w / 2, this.y + this.h / 2);
            }
        }

        function startGame() {
            resizeCanvas();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            score = 0; round = 1; ballCount = 1;
            bricks = [];
            spawnRow();
            setupBalls();
            gameState = 'AIMING';
        }

        function spawnRow() {
            for (let b of bricks) {
                b.r++;
                b.y = b.r * 45 + 10;
                if (b.y >= groundY - 50 && b.hp > 0) gameOver();
            }
            for (let c = 0; c < COLS; c++) {
                if (Math.random() > 0.3) bricks.push(new Brick(0, c, round * 2));
            }
        }

        function setupBalls() {
            balls = [];
            for (let i = 0; i < ballCount; i++) balls.push(new Ball(returnX, groundY, 0, 0));
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'AIMING') return;
            isAiming = true;
            const rect = canvas.getBoundingClientRect();
            aimStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isAiming) return;
            const rect = canvas.getBoundingClientRect();
            aimEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });

        canvas.addEventListener('pointerup', () => {
            if (!isAiming) return;
            isAiming = false;
            let dx = aimStart.x - aimEnd.x;
            let dy = aimStart.y - aimEnd.y;
            let angle = Math.atan2(dy, dx);
            if (angle > -0.1) angle = -0.1;
            if (angle < -Math.PI + 0.1) angle = -Math.PI + 0.1;
            let speed = 9;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;
            gameState = 'PLAYING';
            balls.forEach((ball, index) => {
                setTimeout(() => {
                    ball.x = returnX; ball.y = groundY;
                    ball.vx = vx; ball.vy = vy; ball.active = true;
                }, index * 80);
            });
        });

        function update() {
            if (gameState === 'PLAYING') {
                let activeCount = 0;
                for (let ball of balls) {
                    if (ball.active) {
                        ball.update();
                        activeCount++;
                        for (let brick of bricks) {
                            if (brick.hp > 0) {
                                if (ball.x > brick.x && ball.x < brick.x + brick.w &&
                                    ball.y > brick.y && ball.y < brick.y + brick.h) {
                                    brick.hp--; score += 10; ball.vy *= -1;
                                }
                            }
                        }
                    }
                }
                if (activeCount === 0) {
                    round++;
                    document.getElementById('round-text').innerText = round;
                    document.getElementById('balls-text').innerText = ballCount;
                    spawnRow();
                    if (gameState !== 'GAMEOVER') gameState = 'AIMING';
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let brick of bricks) brick.draw();
            for (let ball of balls) ball.draw();
            if (isAiming) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(returnX, groundY);
                let dx = aimStart.x - aimEnd.x;
                let dy = aimStart.y - aimEnd.y;
                ctx.lineTo(returnX + dx * 2, groundY + dy * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resizeCanvas();
        loop();
    </script>
</body>
</html>
